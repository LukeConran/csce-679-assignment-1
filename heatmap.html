<!DOCTYPE html>
<html>
  
<head>
  <meta charset="utf-8">
  <title>Temperature Heatmap</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    .cell { stroke: #fff; stroke-width: 1px; }
    text { font-family: sans-serif; font-size: 10px; }
    .axis .domain { stroke: #000; }
    .axis .tick line { stroke: #000; }
    #tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      background: white;
      color: black;
      padding: 6px 8px;
      font-family: sans-serif;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <svg id="chart"></svg>
  <div id="tooltip"></div>
  <script src="heatmap.js"></script>
  <button id="toggle-btn">Show Min Temp</button>
</body>

</html>
